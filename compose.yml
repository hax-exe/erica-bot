        condition: service_healthy
    volumes:
      - erica_data:/app/data
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-erica}:${MYSQL_PASSWORD:-changeme}@mysql:3306/${MYSQL_DATABASE:-erica}
      # Override any localhost NodeLink from env_file — talk to the sidecar
      LAVALINK_HOST: nodelink
      LAVALINK_PORT: '3000'
      LAVALINK_SECURE: 'false'
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    networks:
      - erica

volumes:
  erica_data:
  erica_mysql:

networks:
  erica:
    driver: bridge
