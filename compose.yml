# Erica + MySQL + NodeLink (Moonlink-compatible audio server)
#
# Start (loads secrets for ${VAR} interpolation from .env):
#   docker compose up -d
#
# The bot container reads every other setting (MINECRAFT_SERVER_IP, API_ALLOWED_ORIGINS,
# DISCORD_PRESENCE_INTENT, …) from .env via `env_file`; see .env.example.

services:
  mysql:
    image: mysql:8.4
    container_name: erica_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-erica}
      MYSQL_USER: ${MYSQL_USER:-erica}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
