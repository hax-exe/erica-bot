# Erica + MySQL + NodeLink (Moonlink-compatible audio server)
#
# Start (loads secrets for ${VAR} interpolation from .env):
#   docker compose up -d
#
# The bot container reads every other setting (API_ALLOWED_ORIGINS, DISCORD_PRESENCE_INTENT, …)
# from .env via `env_file`; see .env.example.

services:
  mysql:
    image: mysql:8.4
    container_name: erica_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-erica}
      MYSQL_USER: ${MYSQL_USER:-erica}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    # ports:
      # Host-side access for `bun dev` / `bun run db:migrate` (localhost only; stop any host MySQL on 3306 first)
    #   - '127.0.0.1:3306:3306'
    volumes:
      - erica_mysql:/var/lib/mysql
    networks:
      - erica
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-changeme}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nodelink:
    # Pinned to the current stable release (3.9.0 == latest at time of writing); bump deliberately.
    image: performanc/nodelink:3.9.0
    container_name: erica_nodelink
    restart: unless-stopped
    environment:
      NODELINK_SERVER_HOST: '0.0.0.0'
      NODELINK_SERVER_PORT: '3000'
      NODELINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      # Spotify (same credentials Erica uses for search/autocomplete)
      NODELINK_SOURCES_SPOTIFY_ENABLED: 'true'
      NODELINK_SOURCES_SPOTIFY_CLIENTID: ${SPOTIFY_CLIENT_ID:-}
      NODELINK_SOURCES_SPOTIFY_CLIENTSECRET: ${SPOTIFY_CLIENT_SECRET:-}
      # YouTube cipher (same as scripts/nodelink.env). Optional token if the cipher service requires one.
      NODELINK_SOURCES_YOUTUBE_CIPHER_URL: ${NODELINK_SOURCES_YOUTUBE_CIPHER_URL:-https://cipher.kikkia.dev/api}
      NODELINK_SOURCES_YOUTUBE_CIPHER_TOKEN: ${NODELINK_SOURCES_YOUTUBE_CIPHER_TOKEN:-}
      # Explicit client lists (same as scripts/nodelink.env): Android first, Music early.
      NODELINK_SOURCES_YOUTUBE_CLIENTS_SEARCH: '["Android"]'
      NODELINK_SOURCES_YOUTUBE_CLIENTS_PLAYBACK: '["Android","Music","Web","TV","WebEmbedded","IOS"]'
      NODELINK_SOURCES_YOUTUBE_CLIENTS_RESOLVE: '["Android","Music","Web","TV","WebEmbedded","IOS"]'
      # YouTube OAuth (burner Google account only). Verified against NodeLink 3.9.0 config.default.ts:
      # sources.youtube.getOAuthToken (bool) and sources.youtube.clients.settings.TV.refreshToken (array).
      # One-time setup: set NODELINK_YOUTUBE_GET_OAUTH_TOKEN=true, `docker compose up -d nodelink`,
      # follow the device-flow URL/code in `docker compose logs -f nodelink`, put the printed token in
      # NODELINK_YOUTUBE_REFRESH_TOKEN, then set GET_OAUTH_TOKEN back to false (NodeLink exits after printing it).
      NODELINK_SOURCES_YOUTUBE_GETOAUTHTOKEN: ${NODELINK_YOUTUBE_GET_OAUTH_TOKEN:-false}
      NODELINK_SOURCES_YOUTUBE_CLIENTS_SETTINGS_TV_REFRESHTOKEN: '["${NODELINK_YOUTUBE_REFRESH_TOKEN:-}"]'
      # Fallback sources when YouTube streams fail. NodeLink also appends its own hardcoded sources after this list.
      NODELINK_SOURCES_YOUTUBE_FALLBACKSOURCES: '["deezer","soundcloud"]'
      NODELINK_SOURCES_SOUNDCLOUD_ENABLED: 'true'
      NODELINK_DEFAULTSEARCHSOURCE: '["youtube","deezer"]'
      NODELINK_UNIFIEDSEARCHSOURCES: '["youtube","deezer"]'
      NODELINK_SOURCES_JIOSAAVN_ENABLED: 'false'
      NODELINK_SOURCES_GAANA_ENABLED: 'false'
      NODELINK_AUDIO_QUALITY: 'high'
    expose:
      - '3000'
    # Published to localhost so `bun dev` on the host can reach NodeLink (the bot container uses the internal network):
    # ports:
    #   - '127.0.0.1:3000:3000'
    networks:
      - erica

  bot:
    image: ghcr.io/hax-exe/erica-bot:latest
    # build: .   # uncomment to build locally instead
    container_name: erica_bot
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - erica_data:/app/data
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-erica}:${MYSQL_PASSWORD:-changeme}@mysql:3306/${MYSQL_DATABASE:-erica}
      # Override any localhost NodeLink from env_file — talk to the sidecar
      LAVALINK_HOST: nodelink
      LAVALINK_PORT: '3000'
      LAVALINK_SECURE: 'false'
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    networks:
      - erica

volumes:
  erica_data:
  erica_mysql:

networks:
  erica:
    driver: bridge
